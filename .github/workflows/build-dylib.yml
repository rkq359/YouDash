name: Build YouTubeCarPlay dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          python3 --version

      # compile-only uses just the standard library and Xcode tools,
      # so requirements-build.txt (cyan) is intentionally not installed.
      - name: Compile dylib
        run: python3 scripts/build_carplay.py --compile-only

      - name: Record checksum
        run: shasum -a 256 build/YouTubeCarPlay.dylib | tee build/YouTubeCarPlay.dylib.sha256

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeCarPlay-dylib
          path: |
            build/YouTubeCarPlay.dylib
            build/YouTubeCarPlay.dylib.sha256
          if-no-files-found: error
